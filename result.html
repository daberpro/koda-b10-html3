<!DOCTYPE html>
<html>

<head>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <h1 class="title">Data Hasil Survey</h1>
        <table>
            <thead>
                <tr>
                    <th rowspan="2">Nama</th>
                    <th rowspan="2">Umur</th>
                    <th colspan="2">Jenis Kelamin</th>
                    <th colspan="2">Perokok</th>
                    <th colspan="4">Merk rokok dicoba</th>
                </tr>
                <tr>
                    <th>Laki - Laki</th>
                    <th>Perempuan</th>
                    <th>Ya</th>
                    <th>Tidak</th>

                    <th>Marioboro</th>
                    <th>Esse</th>
                    <th>Luck strike</th>
                    <th>Gudang garam filter</th>
                </tr>
            </thead>
            <tbody id="content-body">
                

            </tbody>
        </table>
        <a class="navigation-link" href="index.html">Kembali ke halaman survey</a>
    </div>

    <script>

        function render(rowData = []) {
            const contentBody = document.querySelector("#content-body");
            const brands = [
                "Marioboro",
                "Esse",	
                "Luck strike",	
                "Gudang garam filter"
            ];
            
            rowData.forEach(({
                name,
                age,
                gender,
                smoker,
                brands
            }) => {
                
                const tds = [];
                const tr = document.createElement("tr");
                tr.setAttribute("align", "center");
                for(let i = 0; i < 10; i++){
                    tds.push(document.createElement("td"));
                }

                tds[0].textContent = name;
                tds[1].textContent = age;
                
                if(gender === "Laki-laki"){
                    tds[2].innerHTML = "&check;";
                }

                if(gender === "Perempuan"){
                    tds[3].innerHTML = "&check;";
                }
                
                if(smoker === "Perokok"){
                    tds[4].innerHTML = "&check;";
                }
                
                if(smoker === "Bukan perokok"){
                    tds[5].innerHTML = "&check;";
                }

                brands.forEach((b,i) =>{
                    tds[i + 6].innerHTML = b === brands[i] ? "&check;" : "";
                });

                for(let e of tds){
                    tr.appendChild(e);
                }

                contentBody.appendChild(tr);

            });

        }

        const storage = JSON.parse(localStorage.getItem("data-surveys")) || [];
        render(storage);

    </script>
</body>

</html>
